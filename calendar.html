<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的日曆</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="calendar.css" />
  </head>
  <body>
    <header class="calendar-toolbar">
      <h1>我的日曆</h1>

      <button type="button" id="create-event">
        <span aria-hidden="true">＋</span>
        新增事件
      </button>

      <div class="month-controls" role="group" aria-label="月份導覽">
        <button type="button" id="previous-month" aria-label="上個月">
          <span aria-hidden="true">‹</span>
        </button>
        <button type="button" id="today">今天</button>
        <button type="button" id="next-month" aria-label="下個月">
          <span aria-hidden="true">›</span>
        </button>
      </div>
    </header>

    <div class="calendar-layout">
      <aside class="calendar-sidebar" aria-labelledby="calendar-sidebar-title">
        <div class="calendar-sidebar-content">
          <h2 id="calendar-sidebar-title">日曆導覽</h2>

          <section class="mini-calendar-panel" aria-labelledby="mini-calendar-title">
            <h3 id="mini-calendar-title">迷你月曆</h3>
            <div id="mini-calendar" aria-live="polite">
              <p>迷你月曆準備中</p>
            </div>
          </section>

          <fieldset id="calendar-filters">
            <legend>我的日曆</legend>

            <label>
              <input type="checkbox" value="personal" checked />
              <span class="calendar-color" data-color="teal" aria-hidden="true"></span>
              個人
            </label>
            <label>
              <input type="checkbox" value="documents" checked />
              <span class="calendar-color" data-color="orange" aria-hidden="true"></span>
              證件續期
            </label>
            <label>
              <input type="checkbox" value="medical" checked />
              <span class="calendar-color" data-color="purple" aria-hidden="true"></span>
              醫療
            </label>
            <label>
              <input type="checkbox" value="family" checked />
              <span class="calendar-color" data-color="green" aria-hidden="true"></span>
              家庭
            </label>
            <label>
              <input type="checkbox" value="work" checked />
              <span class="calendar-color" data-color="blue" aria-hidden="true"></span>
              工作
            </label>
            <label>
              <input type="checkbox" value="other" checked />
              <span class="calendar-color" data-color="gray" aria-hidden="true"></span>
              其他
            </label>
          </fieldset>
        </div>

        <section
          id="ai-schedule-panel"
          class="ai-schedule-panel"
          aria-labelledby="ai-schedule-title"
          aria-hidden="true"
        >
          <header class="ai-schedule-header">
            <h2 id="ai-schedule-title">AI 輸入日程</h2>
            <button
              type="button"
              id="close-ai-schedule"
              aria-label="收合 AI 輸入日程"
            >
              <span aria-hidden="true">×</span>
            </button>
          </header>

          <label for="ai-schedule-input">描述日程</label>
          <textarea
            id="ai-schedule-input"
            rows="7"
            placeholder="例如：下週三下午三時看醫生"
          ></textarea>
          <button type="button" id="analyze-ai-schedule">分析日程</button>
        </section>
      </aside>

      <main class="calendar-workspace">
        <section class="calendar" aria-labelledby="calendar-title">
          <h2 id="calendar-title">月曆</h2>
          <div class="weekdays" aria-hidden="true">
            <span>一</span>
            <span>二</span>
            <span>三</span>
            <span>四</span>
            <span>五</span>
            <span>六</span>
            <span>日</span>
          </div>
          <div
            id="calendar-grid"
            class="calendar-grid"
            role="grid"
            aria-live="polite"
          >
            <p class="empty-state">月曆準備中</p>
          </div>
        </section>

        <button
          type="button"
          id="ai-schedule-launcher"
          aria-controls="ai-schedule-panel"
          aria-expanded="false"
        >
          <span class="ai-launcher-mark" aria-hidden="true">AI</span>
          <span>輸入日程</span>
        </button>
      </main>
    </div>

    <dialog id="event-dialog" aria-labelledby="event-dialog-title">
      <form id="event-form" novalidate>
        <header class="dialog-header">
          <h2 id="event-dialog-title">新增事件</h2>
          <button type="button" id="close-event-dialog">關閉</button>
        </header>

        <p id="event-form-error" class="form-error" role="alert" tabindex="-1" hidden></p>

        <label for="event-title">標題</label>
        <input id="event-title" name="title" type="text" required />

        <label for="event-date">日期</label>
        <input id="event-date" name="date" type="date" required />

        <label for="event-calendar">日曆</label>
        <select id="event-calendar" name="calendarId">
          <option value="personal">個人</option>
          <option value="documents">證件續期</option>
          <option value="medical">醫療</option>
          <option value="family">家庭</option>
          <option value="work">工作</option>
          <option value="other">其他</option>
        </select>

        <div class="time-fields">
          <div>
            <label for="event-start-time">開始時間</label>
            <input id="event-start-time" name="startTime" type="time" />
          </div>
          <div>
            <label for="event-end-time">結束時間</label>
            <input id="event-end-time" name="endTime" type="time" />
          </div>
        </div>

        <label for="event-notes">備註</label>
        <textarea id="event-notes" name="notes" rows="4"></textarea>

        <footer class="dialog-actions">
          <button type="button" id="delete-event" class="danger-button" hidden>
            刪除
          </button>
          <div>
            <button type="button" id="cancel-event">取消</button>
            <button type="submit">儲存</button>
          </div>
        </footer>
      </form>
    </dialog>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
